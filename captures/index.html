:root{--bg:#f1f1f1;--card:#fff;--text:#303030;--sub:#616161;--line:#e3e3e3;--accent:#005bd3}

.grid.wide .im{height:300px} .card img{max-width:100%;max-height:100%;object-fit:contain}
.card p{margin:0;padding:8px 10px 10px;font-size:13px;line-height:18px} .card p span{color:var(--sub);display:block;font-size:12px}
.links{padding:0 10px 10px;font-size:12px} .links a{color:var(--accent);margin-right:10px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:24px}
#lb img{max-width:100%;max-height:100%;border-radius:8px;background:#fff} .hide{display:none}
@media (max-width:600px){main,header{padding-left:16px;padding-right:16px} .grid,.grid.wide{grid-template-columns:1fr}}

const tabs=[['sheets','Overview sheets'],['interactions','Interaction GIFs ('+D.interactions.length+')'],['responsive','Responsive sweeps ('+D.responsive.length+')'],['stills','All stills ('+D.stills.length+')']];
let tab='sheets',view='d';const $=s=>document.querySelector(s);
const lb=$('#lb');lb.onclick=()=>lb.style.display='none';
const zoom=src=>{lb.querySelector('img').src=src;lb.style.display='flex'};
const card=(src,title,sub,links='')=>'<div class="card" data-z="'+src+'"><div class="im"><img loading="lazy" src="'+src+'"></div><p>'+title+(sub?'<span>'+sub+'</span>':'')+'</p>'+links+'</div>';
function render(){
  $('#views').classList.toggle('hide',tab!=='stills');
  const m=$('#main');let h='';
  if(tab==='sheets')h='<div class="grid wide">'+D.sheets.map(s=>card(s.src,s.name)).join('')+'</div>';
  if(tab==='interactions'||tab==='responsive')h='<div class="grid wide">'+D[tab].map(g=>card(g.gif,g.name,'','<div class="links"><a href="'+g.gif+'" target="_blank">GIF</a><a href="'+g.mp4+'" target="_blank">MP4</a></div>')).join('')+'</div>';
  if(tab==='stills')for(const g of D.groups){const l=D.stills.filter(s=>s.g===g);if(!l.length)continue;
    h+='<h2>'+g+' · '+l.length+'</h2><div class="grid">'+l.map(s=>{const src=view==='d'?(s.d||s.m):(s.m||s.d);return card(src,s.n,s.t)}).join('')+'</div>';}
  m.innerHTML=h;m.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.tagName!=='A')zoom(c.dataset.z)});
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
$('#tabs').innerHTML=tabs.map(([k,l])=>'<button data-t="'+k+'">'+l+'</button>').join('');
$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$('#views').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));render()}};
render();
</script></body></html>
