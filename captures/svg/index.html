:root{--bg:#f1f1f1;--card:#fff;--text:#303030;--sub:#616161}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif;padding:24px 16px}
h1{font-size:18px;margin:0 0 4px} p{color:var(--sub);font-size:13px;margin:0 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));max-width:1480px}
figure{margin:0;background:var(--card);border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.07);padding:12px}
figure>svg{width:100%;height:auto;display:block}
figure.d{grid-column:1/-1}
figure.m>svg{max-width:375px;margin:0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
figcaption{font-size:12px;color:var(--sub);margin-top:8px;word-break:break-word}
</style></head><body>
<h1>Animated SVG interactions</h1>
<p>Vector rebuilds of the component captures, drawn from Poltail tokens. Each file in interactions/ is standalone, embeds Inter, and loops. Mobile ones are 375 × 812.</p>

    <g id="s2-r1" class="a" opacity="0"><text x="897.0" y="226.5" font-size="14" font-weight="450" fill="#303030">Welcome back to the Nexleaf AI chatbot, Raphael. Here's the answer to your</text><text x="897.0" y="246.5" font-size="14" font-weight="450" fill="#303030">question:</text><text x="897.0" y="286.5" font-size="14" font-weight="450" fill="#303030">The Haier HBC 150 and HBC 260 fridges are designed primarily for safe</text><text x="897.0" y="306.5" font-size="14" font-weight="450" fill="#303030">storage of vaccines, medicines, and other temperature-sensitive healthcare</text><text x="897.0" y="326.5" font-size="14" font-weight="450" fill="#303030">products. They should not be used to store poisonous, harmful, or radioactive</text><text x="897.0" y="346.5" font-size="14" font-weight="450" fill="#303030">items unless in a secure, designated area.</text><text x="897.0" y="386.5" font-size="14" font-weight="450" fill="#303030">Do not use any electric appliance inside the fridge unless recommended by the</text><text x="897.0" y="406.5" font-size="14" font-weight="450" fill="#303030">manufacturer. For maintenance, you can clean the interior and exterior, remove</text><text x="897.0" y="426.5" font-size="14" font-weight="450" fill="#303030">dust from the condenser and compressor, and ensure the door seal is clean.</text><text x="897.0" y="466.5" font-size="14" font-weight="450" fill="#303030">Always disconnect power before maintenance or if the fridge will be unused</text><text x="897.0" y="486.5" font-size="14" font-weight="450" fill="#303030">for a long period. Follow all safety and disposal guidelines as outlined in the</text><text x="897.0" y="506.5" font-size="14" font-weight="450" fill="#303030">manual.</text><path d="M905.00 533.00H963.30A8.00 8.00 0 0 1 971.30 541.00V553.00A8.00 8.00 0 0 1 963.30 561.00H905.00A8.00 8.00 0 0 1 897.00 553.00V541.00A8.00 8.00 0 0 1 905.00 533.00Z" fill="#ffffff"/><g clip-path="url(#s2-cp18)"><path fill-rule="evenodd" d="M877 5
